[project]
name = "voice-agent-tr"
version = "0.1.0"
description = "Türkçe gerçek zamanlı sesli müşteri hizmetleri asistanı"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=30",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.1",
    "huggingface-hub>=0.26",
    "piper-tts>=1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "services/mock_crm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# Satır uzunluğunu formatlayıcı yönetir; uzun Türkçe metinler bölünmez.
ignore = ["E501"]
# Türkçe metinlerdeki noktasız ı harfi belirsiz karakter sayılmasın.
allowed-confusables = ["ı"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent", "mock_crm", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "services"]
packages = ["voice_agent", "mock_crm"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "piper.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
