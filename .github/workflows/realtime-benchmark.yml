name: Gerçek zamanlı ölçüm

# Docker Compose ile tüm yığını (ağ geçidi, sahte CRM, Redis, Prometheus, Grafana) kurar,
# WebSocket üzerinden sentetik sesle konuşan bir müşteri çalıştırır ve gecikme dökümünü,
# Prometheus yüzdeliklerini ve Grafana panosunun ekran görüntüsünü saklar.
on:
  workflow_dispatch:
    inputs:
      stt_model:
        description: STT modeli
        default: "small"
      repeat:
        description: Diyalog tekrarı
        default: "3"
  push:
    paths:
      - "src/voice_agent/gateway/**"
      - "src/voice_agent/audio/**"
      - "src/voice_agent/telemetry/**"
      - "src/voice_agent/evaluation/realtime_bench.py"
      - "deploy/**"
      - "Dockerfile"
      - ".github/workflows/realtime-benchmark.yml"

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STT_MODEL: ${{ github.event.inputs.stt_model || 'small' }}
    steps:
      - uses: actions/checkout@v4
      - name: Yığını başlat
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra audio
      - name: Hugging Face önbelleği (müşteri sesi için Piper)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-piper-${{ hashFiles('src/voice_agent/audio/tts.py') }}
      - name: Modellerin yüklenmesini bekle
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/ready; then echo; exit 0; fi
            sleep 10
          done
          curl -s http://localhost:8000/ready; docker compose -f deploy/docker-compose.yml logs gateway; exit 1
      - name: Ölçüm
        run: |
          uv run python -m voice_agent.evaluation.realtime_bench \
            --url ws://localhost:8000/ws/voice --prometheus http://localhost:9090 \
            --repeat "${{ github.event.inputs.repeat || '3' }}" --out eval/reports/realtime
          cat eval/reports/realtime/realtime.md >> "$GITHUB_STEP_SUMMARY"
      - name: Grafana ekran görüntüsü
        run: |
          uv run --with playwright==1.49.1 python -m playwright install --with-deps chromium
          uv run --with playwright==1.49.1 python deploy/grafana/screenshot.py \
            http://localhost:3000 eval/reports/realtime/grafana.png
      - name: Servis günlükleri
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs > eval/reports/realtime/compose.log 2>&1 || true
      - name: Sonuçları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-benchmark
          path: eval/reports/realtime/
      - name: Kapat
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
