name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: make lint
      - name: Tip denetimi
        run: make typecheck
      - name: Testler
        run: make test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Değerlendirme (30 senaryo, 25 saldırı)
        run: make eval
      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose ile ayağa kaldır
        run: docker compose -f deploy/docker-compose.yml up --build -d --wait
      - name: Sağlık kontrolü
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/health
          curl --fail --retry 5 --retry-delay 2 -o /dev/null http://localhost:8000/
          curl --fail --retry 10 --retry-delay 3 http://localhost:9090/-/ready
          curl --fail --retry 10 --retry-delay 3 http://localhost:3000/api/health
          curl --fail -s http://localhost:8000/metrics | grep -q voice_sessions_total
      - name: Kapat
        if: always()
        run: docker compose -f deploy/docker-compose.yml down
